<!DOCTYPE html>
<html>
<head>
  <title>Pravallika Portfolio</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      transition: 0.3s;
    }

    .dark {
      background: #121212;
      color: white;
    }

    .navbar {
      background: #111;
      padding: 15px;
      text-align: center;
    }

    .navbar a {
      color: white;
      margin: 15px;
      text-decoration: none;
    }

    .home {
      text-align: center;
      padding: 60px;
      background: linear-gradient(to right, #00adb5, #393e46);
      color: white;
      animation: fadeIn 2s;
    }

    .home img {
      width: 120px;
      border-radius: 50%;
    }

    .btn {
      background: #ff5722;
      color: white;
      padding: 10px 20px;
      border: none;
      margin: 10px;
      cursor: pointer;
    }

    .section {
      padding: 40px;
      text-align: center;
    }

    .card {
      background: white;
      margin: 20px;
      padding: 20px;
      border-radius: 10px;
      display: inline-block;
      width: 250px;
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .dark .card {
      background: #1e1e1e;
    }

    @keyframes fadeIn {
      from {opacity:0;}
      to {opacity:1;}
    }

  </style>
</head>

<body>

  <!-- NAVBAR -->
  <div class="navbar">
    <a href="#">Home</a>
    <a href="#projects">Projects</a>
    <a href="#contact">Contact</a>
    <button onclick="toggleMode()" class="btn"> Mode</button>
  </div>

  <!-- HOME -->
  <div class="home">
    <img src="profile.jpg">
    <h1>Hello, I'm Pravallika </h1>
    <h3>Frontend Developer</h3>

    <a href="resume.pdf" download>
      <button class="btn">Download Resume</button>
    </a>

    <br>

    <!-- Social Links -->
    <a href="https://github.com/srisai-pravallika-tirumalasetty-boop" target="_blank">
      <button class="btn">GitHub</button>
    </a>

    <a href="https://linkedin.com" target="_blank">
      <button class="btn">LinkedIn</button>
    </a>

  </div>

  <!-- PROJECTS -->
  <div id="projects" class="section">
    <h2>My Projects</h2>

    <div class="card">
      <h3>Portfolio Website</h3>
      <p>My personal portfolio</p>
    </div>

    <div class="card">
      <h3>Todo App</h3>
      <p>Coming soon</p>
    </div>

  </div>

  <!-- CONTACT -->
  <div id="contact" class="section">
    <h2>Contact</h2>
    <p>Email: srisaipravallika@gmail.com</p>
  </div>

  <!-- JAVASCRIPT -->
  <script>
    function toggleMode() {
      document.body.classList.toggle("dark");
    }
  </script>

</body>
</html>
